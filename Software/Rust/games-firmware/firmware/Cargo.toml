[package]
name = "firmware"
version = "0.1.0"
edition = "2021"

[features]
default = ["dice", "esp32s3"]

esp32 = [ "esp-backtrace/esp32", "esp-bootloader-esp-idf/esp32", "esp-hal/esp32", "esp-println/esp32" ]
esp32s3 = [ "esp-backtrace/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-hal/esp32s3", "esp-println/esp32s3" ]

demo = []
snake = []
seven = []
dice = []


[dependencies]
esp-backtrace = { version = "0.19", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5" }
esp-hal = { version = "1.1", features = ["unstable"] }
esp-println = { version = "0.17" }

games = { path = "../games" }
raylib_camp = { path = "../raylib_camp" }
