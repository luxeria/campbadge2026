; LuxCamp Badge 2026 - example firmware
;
; The badge is bring-your-own-microcontroller. Two boards are supported:
;
;   atom_*    M5Stack Atom Lite    (ESP32-PICO-D4)
;   atoms3_*  M5Stack AtomS3 Lite  (ESP32-S3)
;
; They have the same footprint but different GPIO numbers; the mapping lives in
; lib/Badge/BadgePins.h.
;
; Every example lives in its own folder under examples/ and gets one
; environment per board, so pick the pair you want when you build:
;
;   pio run -e atom_i2c_scan   -t upload -t monitor
;   pio run -e atoms3_display  -t upload -t monitor
;
; Building without -e uses the combined demo on the Atom Lite (default_envs).

[platformio]
src_dir = examples
default_envs = atom_hello_badge

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GC9A01A @ ^1.1.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

; --- Boards -----------------------------------------------------------------
;
; These are not environments, they are building blocks the environments below
; pull in with `extends`.

[atom]
board = m5stack-atom

[atoms3]
board = m5stack-atoms3
; The m5stack-atoms3 board definition enables the native USB peripheral but
; leaves Serial on UART0, which is not connected to the USB-C port. Without
; this flag nothing you print shows up on the serial monitor. The Atom Lite
; does not need it - it has a real USB-to-serial chip on UART0.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Examples ---------------------------------------------------------------

; Finds which pins the badge's I2C bus is wired to. Only needed if you use a
; board that is not listed in BadgePins.h, or if you wired things up yourself.
[env:atom_pin_probe]
extends = atom
build_src_filter = -<*> +<00_pin_probe/>

[env:atoms3_pin_probe]
extends = atoms3
build_src_filter = -<*> +<00_pin_probe/>

; Scans the I2C bus and reports the address of the TCA9539 I/O expander.
; Run this one first on a fresh badge.
[env:atom_i2c_scan]
extends = atom
build_src_filter = -<*> +<01_i2c_scan/>

[env:atoms3_i2c_scan]
extends = atoms3
build_src_filter = -<*> +<01_i2c_scan/>

; Blinks and chases the four LEDs via the I/O expander.
[env:atom_leds]
extends = atom
build_src_filter = -<*> +<02_leds/>

[env:atoms3_leds]
extends = atoms3
build_src_filter = -<*> +<02_leds/>

; Prints debounced button presses to the serial monitor.
[env:atom_buttons]
extends = atom
build_src_filter = -<*> +<03_buttons/>

[env:atoms3_buttons]
extends = atoms3
build_src_filter = -<*> +<03_buttons/>

; Beeps, sweeps and plays a short melody on the passive buzzer.
[env:atom_buzzer]
extends = atom
build_src_filter = -<*> +<04_buzzer/>

[env:atoms3_buzzer]
extends = atoms3
build_src_filter = -<*> +<04_buzzer/>

; Draws text and graphics on the round GC9A01A display.
[env:atom_display]
extends = atom
build_src_filter = -<*> +<05_display/>

[env:atoms3_display]
extends = atoms3
build_src_filter = -<*> +<05_display/>

; All components together: buttons switch screens, light LEDs and click.
[env:atom_hello_badge]
extends = atom
build_src_filter = -<*> +<06_hello_badge/>

[env:atoms3_hello_badge]
extends = atoms3
build_src_filter = -<*> +<06_hello_badge/>
